name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bloodsync
          POSTGRES_PASSWORD: bloodsync
          POSTGRES_DB: bloodsync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bloodsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports: ['1025:1025', '8025:8025']
    env:
      SITE_URL: https://bloodsync.example.invalid
      API_ORIGIN: https://api.example.invalid
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://bloodsync:bloodsync@localhost:5432/bloodsync
      WEB_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-longer-than-thirty-two-characters
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: BloodSync <no-reply@localhost>
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 11.19.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @bloodsync/api exec prisma migrate deploy
      - run: pnpm audit --audit-level high
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: bash scripts/run-integration.sh
